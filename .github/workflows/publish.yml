name: publish to npmjs
on:
  release:
    types: [prereleased, released]
jobs:
  build-and-publish:
    # prevents this action from running on forks
    # only allow listed user to publish
    if: |
      github.repository == 'chimurai/http-proxy-middleware' &&
      github.triggering_actor == 'chimurai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC
    env:
      PINNED_NPM_VERSION: '11.5.1'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later is installed.
      # Pin to an exact, immutable version and do not execute lifecycle scripts
      # from the fetched package: this job holds `id-token: write` and can mint
      # the npm provenance token, so third-party code must never run here.
      - name: Update npm
        run: npm install -g "npm@${PINNED_NPM_VERSION}" --ignore-scripts

      - name: Verify npm toolchain
        run: |
          INSTALLED="$(npm --version)"
          echo "npm version: ${INSTALLED}"
          if [ "${INSTALLED}" != "${PINNED_NPM_VERSION}" ]; then
            echo "::error::expected npm ${PINNED_NPM_VERSION} but found ${INSTALLED}"
            exit 1
          fi

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Publish to NPM (beta)
        if: 'github.event.release.prerelease'
        run: npm stage publish --access public --tag beta

      - name: Publish to NPM (stable)
        if: '!github.event.release.prerelease'
        run: npm stage publish --access public
